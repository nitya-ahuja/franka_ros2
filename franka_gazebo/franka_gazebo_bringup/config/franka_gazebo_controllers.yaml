dynamic_tube_controller:
  ros__parameters:
    # ─── General & Hardware Switch ───
    robot_type: "fr3"
    gazebo: true
    use_6d_nullspace: false

    # ─── Task (IK) Parameters ───
    k_task: 0.2
    vel_limit: 2.0
    lambda_dls: 0.02
    drift_limit: 0.1

    # ─── Danger Field (df_) Parameters ───
    df_k1: 1.0
    df_k2: 0.25
    df_gamma: 1.0
    df_gamma_soft: 5.0
    num_points: 100

    # ─── Safety & Transition Parameters ───
    k_safe: 0.014
    epsilon: 0.3
    delta: 30.0

    # ─── Dynamic Spatiotemporal Tube (dstt_) Parameters ───
    dstt_k1: 7.5
    dstt_k2: 15.0
    dstt_gamma: 200.0
    rho_max: 0.5
    rho_min: 0.01

    # ─── Funnel Parameters ───
    mu_decay: 0.0
    q_vec_steady: 0.5

    # ─── Joint Space Constraints ───
    nu_joint_limit: 100.0

    # ─── Singularity Avoidance ───
    k_singularity: 0.03

joint_position_example_controller:
  ros__parameters:
    gazebo: true

joint_velocity_example_controller:
  ros__parameters:
    gazebo: true

